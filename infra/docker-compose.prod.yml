version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurag-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: aurag_enterprise
      POSTGRES_USER: aurag_admin
      POSTGRES_PASSWORD: ChangeMeInProductionVault123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurag_admin -d aurag_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurag-prod-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: aurag-prod-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/production_password_123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: aurag-prod-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: aurag-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aurag_admin:ChangeMeInProductionVault123!@postgres:5432/aurag_enterprise
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LLM_PROVIDER: bedrock
      AWS_DEFAULT_REGION: ap-south-1
      SITE_ID: plant-mumbai-01
      AUTH_ENABLED: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: aurag-prod-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_SITE_ID: plant-mumbai-01
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
